<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FakeTL · FakeTimeLanguage</title><link rel="icon" type="image/png" href="icons/icon32.png"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header class="brand-row">
    <div><h1>FakeTL<span class="brand-dot">·</span></h1><span class="brand-subtitle">FakeTimeLanguage</span></div>
    <div id="ui-language" class="language-flags" role="group" data-i18n-aria="interfaceLanguageAria" aria-label="Язык интерфейса">
      <button type="button" class="flag-button" data-ui-language="ru" aria-label="Русский" title="Русский" aria-pressed="true"><img src="icons/ru.svg" alt=""></button>
      <button type="button" class="flag-button" data-ui-language="en" aria-label="English" title="English" aria-pressed="false"><img src="icons/gb.svg" alt=""></button>
    </div>
  </header>
  <label class="enable-card"><span><strong data-i18n="enabled">Подмена данных</strong><small id="enabled-state"></small></span><input id="enabled" type="checkbox" role="switch" aria-label="Подмена данных" data-i18n-aria="enabled"></label>
  <nav class="tabs" role="tablist" data-i18n-aria="settingsTabs" aria-label="Разделы настроек">
    <button type="button" id="tab-profile" role="tab" aria-selected="true" aria-controls="panel-profile" data-i18n="profileTab">Язык и время</button>
    <button type="button" id="tab-sites" role="tab" aria-selected="false" aria-controls="panel-sites" data-i18n="sitesTab">Сайты</button>
  </nav>
  <main>
    <form id="settings-form">
      <div id="panel-profile" role="tabpanel" aria-labelledby="tab-profile">
        <section class="card">
          <label for="zone-search" class="field-title" data-i18n="timeZone">Часовой пояс</label>
          <input id="zone-search" type="search" data-i18n-placeholder="zoneSearch" placeholder="Найти город или часовой пояс…" autocomplete="off">
          <select id="time-zone" size="2" data-i18n-aria="timeZone" aria-label="Часовой пояс"></select>
          <p id="zone-info" class="hint"></p>
        </section>
        <section class="card">
          <label for="primary-language" class="field-title" data-i18n="primaryLanguage">Основной язык сайта</label>
          <input id="primary-language" list="language-examples" value="en-US" required maxlength="100" autocomplete="off" aria-describedby="language-hint">
          <datalist id="language-examples"><option value="en-US"><option value="en-GB"><option value="ru-RU"><option value="de-DE"><option value="fr-FR"><option value="ja-JP"><option value="zh-CN"><option value="es-ES"></datalist>
          <label for="other-languages" class="field-title spaced" data-i18n="otherLanguages">Другие языки по приоритету</label>
          <textarea id="other-languages" rows="1" data-i18n-placeholder="languagesPlaceholder" placeholder="Например: en, de-DE" maxlength="1000"></textarea>
          <p id="language-hint" class="hint" data-i18n="languageHint">Теги BCP 47: en-US, ru-RU. Основной язык — первый в списке.</p>
        </section>
      </div>
      <div id="panel-sites" role="tabpanel" aria-labelledby="tab-sites" hidden>
        <section class="card">
          <h2 data-i18n="scopeTitle">Где применять подмену</h2>
          <label class="scope-option"><input type="radio" name="site-mode" value="exclude" checked><span><strong data-i18n="excludeMode">Везде, кроме списка</strong><small data-i18n="excludeDescription">Указанные сайты увидят исходные значения.</small></span></label>
          <label class="scope-option"><input type="radio" name="site-mode" value="include"><span><strong data-i18n="includeMode">Только на сайтах из списка</strong><small data-i18n="includeDescription">Все остальные сайты увидят исходные значения.</small></span></label>
          <button id="add-site" type="button" class="add-site"><span aria-hidden="true">＋</span> <span data-i18n="addCurrentSite">Добавить текущий сайт</span></button>
          <label for="site-list" id="site-list-label" class="field-title spaced"></label>
          <textarea id="site-list" rows="3" data-i18n-placeholder="sitesPlaceholder" placeholder="example.com&#10;news.example.org" maxlength="26000" spellcheck="false" autocomplete="off" aria-describedby="sites-hint scope-note"></textarea>
          <p id="current-site" class="hint"></p>
          <p id="sites-hint" class="hint" data-i18n="sitesHint">Домены или адреса, по одному на строку. Поддомены включены; путь и порт не учитываются.</p>
          <p id="scope-note" class="scope-note"></p>
        </section>
      </div>
    </form>
    <section class="active-card" data-i18n-aria="active" aria-label="Сохранённый профиль"><div class="active-heading"><span class="status-dot" aria-hidden="true"></span><strong data-i18n="active">Сохранённый профиль</strong></div><pre id="active">Проверка…</pre></section>
  </main>
  <footer>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="actions"><button id="save" type="submit" form="settings-form" data-i18n="save" disabled>Сохранить</button><button id="reload" type="button" class="secondary" data-i18n="reload">Перезагрузить</button></div>
    <p class="reload-note" data-i18n="reloadNote">Новые настройки начнут действовать после перезагрузки страницы.</p>
  </footer>
  <script src="popup.js" type="module"></script>
</body></html>
